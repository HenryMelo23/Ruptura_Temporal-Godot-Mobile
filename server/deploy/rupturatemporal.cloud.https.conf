server {
    listen 80;
    listen [::]:80;
    server_name rupturatemporal.cloud www.rupturatemporal.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/ruptura/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://rupturatemporal.cloud$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rupturatemporal.cloud www.rupturatemporal.cloud;

    ssl_certificate /opt/ruptura/acme-config/live/rupturatemporal.cloud/fullchain.pem;
    ssl_certificate_key /opt/ruptura/acme-config/live/rupturatemporal.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RupturaSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/rupturatemporal.access.log;
    error_log /var/log/nginx/rupturatemporal.error.log;

    if ($host = www.rupturatemporal.cloud) {
        return 301 https://rupturatemporal.cloud$request_uri;
    }
    location = / { return 302 /leaderboard; }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        client_max_body_size 4m;
        proxy_read_timeout 90s;
    }
}
