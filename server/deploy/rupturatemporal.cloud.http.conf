# Dedicated virtual host. Do not replace the VPS default or other sites.
server {
    listen 80;
    listen [::]:80;
    server_name rupturatemporal.cloud www.rupturatemporal.cloud;

    access_log /var/log/nginx/rupturatemporal.access.log;
    error_log /var/log/nginx/rupturatemporal.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/ruptura/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / { return 302 /leaderboard; }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        client_max_body_size 4m;
        proxy_read_timeout 90s;
    }
}
